<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Distraught</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #fff;
            color: #000;
        }

        header {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 40px;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 40px;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .payment-container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .payment-title {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }

        .payment-section {
            border: 1px solid #e0e0e0;
            padding: 30px;
            margin-bottom: 30px;
        }

        .payment-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #000;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .payment-summary {
            border-top: 2px solid #000;
            padding-top: 20px;
            text-align: right;
            font-size: 18px;
            font-weight: 600;
        }

        .payment-actions {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .btn-primary {
            padding: 14px 30px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #fff;
            color: #000;
        }

        .btn-secondary {
            padding: 14px 30px;
            background: #fff;
            color: #000;
            border: 1px solid #d9d9d9;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: #000;
        }

        .success-message {
            display: none;
            background: #f0fff0;
            border: 2px solid #4CAF50;
            padding: 30px;
            margin-top: 20px;
            text-align: center;
        }

        .success-message h3 {
            color: #4CAF50;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .order-details {
            background: #fff;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #ddd;
            text-align: left;
        }

        .order-details p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }

        .order-details .total {
            font-weight: bold;
            border-top: 1px solid #000;
            padding-top: 10px;
            margin-top: 10px;
            font-size: 16px;
        }

        .error-message {
            color: #ff3860;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #f8f8f8;
            margin-top: 60px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo.jpg" alt="Distraught Logo">
                Distraught
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="product.html">Shop</a>
                <a href="shoppingcart.html">Cart</a>
            </nav>
        </div>
    </header>

    <main class="payment-container">
        <h1 class="payment-title">Payment</h1>
        <div id="paymentContent">
        </div>

        <div class="success-message" id="successMessage">
            <h3>✓ Payment Successful!</h3>
            <div class="order-details" id="successOrderDetails"></div>
            <p style="margin: 20px 0;">A confirmation has been sent to your email.</p>
            <p style="margin-bottom: 20px;">Thank you for shopping with Distraught!</p>
            <a href="product.html" class="btn-primary">Continue Shopping</a>
            <a href="dashboard.html" class="btn-secondary" style="margin-left: 10px;">View Orders</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Distraught. All rights reserved.</p>
        <p>Free shipping on orders over RM50</p>
    </footer>

    <script>
        function getUsers() {
            return JSON.parse(localStorage.getItem('users')) || [];
        }

        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getCurrentUser() {
            const email = localStorage.getItem('currentUserEmail');
            if (!email) return null;
            const users = getUsers();
            return users.find(u => u.email === email);
        }

        function updateCurrentUser(updatedUser) {
            const users = getUsers();
            const index = users.findIndex(u => u.email === updatedUser.email);
            if (index !== -1) {
                users[index] = updatedUser;
                saveUsers(users);
            }
        }
        let currentOrder = null;

        function loadOrder() {
            const orderData = localStorage.getItem('currentOrder');
            
            if (!orderData) {
                alert('No order found. Please complete checkout first.');
                window.location.href = 'checkout.html';
                return;
            }
            
            try {
                currentOrder = JSON.parse(orderData);
                displayPaymentPage();
            } catch (error) {
                console.error('Error loading order:', error);
                alert('Error loading order details. Please try again.');
                window.location.href = 'checkout.html';
            }
        }

        function displayPaymentPage() {
            const paymentContent = document.getElementById('paymentContent');
            
            if (!currentOrder || !currentOrder.items || currentOrder.items.length === 0) {
                paymentContent.innerHTML = '<p>No items in order.</p>';
                return;
            }

            paymentContent.innerHTML = `
                <div class="payment-section">
                    <h3>Order Summary</h3>
                    <div id="orderDetails"></div>
                    <div class="payment-summary">
                        Total: RM <span id="totalAmount">${currentOrder.totals.grandTotal.toFixed(2)}</span>
                    </div>
                </div>

                <div class="payment-section">
                    <h3>Payment Method</h3>
                    <div class="form-group">
                        <label>Card Type</label>
                        <select id="cardType">
                            <option value="">Select card type</option>
                            <option value="visa">Visa</option>
                            <option value="mastercard">MasterCard</option>
                            <option value="amex">American Express</option>
                        </select>
                        <div class="error-message" id="cardTypeError"></div>
                    </div>
                    <div class="form-group">
                        <label>Cardholder Name</label>
                        <input type="text" id="cardName" placeholder="Name on card" required>
                        <div class="error-message" id="cardNameError"></div>
                    </div>
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required maxlength="19">
                        <div class="error-message" id="cardNumberError"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Expiry Date</label>
                            <input type="text" id="expiryDate" placeholder="MM/YY" required maxlength="5">
                            <div class="error-message" id="expiryDateError"></div>
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="password" id="cvv" placeholder="123" required maxlength="4">
                            <div class="error-message" id="cvvError"></div>
                        </div>
                    </div>
                </div>

                <div class="payment-actions">
                    <a href="checkout.html" class="btn-secondary">Back to Checkout</a>
                    <button class="btn-primary" onclick="processPayment()">Pay Now</button>
                </div>
            `;

            const orderDetails = document.getElementById('orderDetails');
            let html = '';
            currentOrder.items.forEach(item => {
                html += `
                    <p style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>RM${(item.price * item.quantity).toFixed(2)}</span>
                    </p>
                `;
            });
            orderDetails.innerHTML = html;

            setupInputFormatting();
        }

        function setupInputFormatting() {
            const cardNumber = document.getElementById('cardNumber');
            if (cardNumber) {
                cardNumber.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
                    let formatted = '';
                    for (let i = 0; i < value.length; i++) {
                        if (i > 0 && i % 4 === 0) {
                            formatted += ' ';
                        }
                        formatted += value[i];
                    }
                    e.target.value = formatted.substring(0, 19);
                });
            }

            const expiryDate = document.getElementById('expiryDate');
            if (expiryDate) {
                expiryDate.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/[^0-9]/g, '');
                    if (value.length >= 2) {
                        value = value.substring(0, 2) + '/' + value.substring(2, 4);
                    }
                    e.target.value = value.substring(0, 5);
                });
            }

            const cvv = document.getElementById('cvv');
            if (cvv) {
                cvv.addEventListener('keypress', function(e) {
                    if (!/[0-9]/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            }
        }

        function validatePayment() {
            let isValid = true;
            
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });

            const cardType = document.getElementById('cardType').value;
            const cardName = document.getElementById('cardName').value.trim();
            const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const expiryDate = document.getElementById('expiryDate').value.trim();
            const cvv = document.getElementById('cvv').value.trim();

            if (!cardType) {
                document.getElementById('cardTypeError').textContent = 'Please select a card type';
                document.getElementById('cardTypeError').style.display = 'block';
                isValid = false;
            }

            if (!cardName) {
                document.getElementById('cardNameError').textContent = 'Cardholder name is required';
                document.getElementById('cardNameError').style.display = 'block';
                isValid = false;
            }

            if (cardNumber.length < 16) {
                document.getElementById('cardNumberError').textContent = 'Please enter a valid 16-digit card number';
                document.getElementById('cardNumberError').style.display = 'block';
                isValid = false;
            }

            if (!expiryDate || !/^(0[1-9]|1[0-2])\/([0-9]{2})$/.test(expiryDate)) {
                document.getElementById('expiryDateError').textContent = 'Please enter expiry date in MM/YY format';
                document.getElementById('expiryDateError').style.display = 'block';
                isValid = false;
            }

            if (!cvv || cvv.length < 3) {
                document.getElementById('cvvError').textContent = 'Please enter a valid CVV';
                document.getElementById('cvvError').style.display = 'block';
                isValid = false;
            }

            return isValid;
        }

        window.processPayment = function() {
            if (!currentOrder) {
                alert('No order found');
                return;
            }

            if (!validatePayment()) {
                return;
            }

            const paymentDetails = {
                cardType: document.getElementById('cardType').value,
                cardName: document.getElementById('cardName').value.trim(),
                cardLastFour: document.getElementById('cardNumber').value.slice(-4),
                paymentDate: new Date().toISOString(),
                transactionId: 'TXN' + Date.now()
            };

            currentOrder.payment = paymentDetails;
            currentOrder.status = 'paid';
            currentOrder.paidAt = new Date().toISOString();

            const user = getCurrentUser();
            if (user) {
                if (!user.orders) user.orders = [];
                user.orders.push(currentOrder);
                updateCurrentUser(user);
            }

            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            orders.push(currentOrder);
            localStorage.setItem('orders', JSON.stringify(orders));

            if (user) {
                user.cart = [];
                updateCurrentUser(user);
            } else {
                localStorage.removeItem('guestCart');
            }

            showSuccessMessage();
        };

        function showSuccessMessage() {
            document.getElementById('paymentContent').style.display = 'none';
            
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';

            const successOrderDetails = document.getElementById('successOrderDetails');
            
            let html = `
                <p><strong>Order ID:</strong> ${currentOrder.orderId}</p>
                <p><strong>Date:</strong> ${new Date(currentOrder.date).toLocaleDateString()}</p>
                <p><strong>Payment Method:</strong> ${currentOrder.payment.cardType.toUpperCase()}</p>
                <p><strong>Card:</strong> **** **** **** ${currentOrder.payment.cardLastFour}</p>
                <hr style="margin: 15px 0;">
            `;
            
            currentOrder.items.forEach(item => {
                html += `
                    <p style="display:flex; justify-content:space-between;">
                        <span>${item.name} x ${item.quantity}</span>
                        <span>RM${(item.price * item.quantity).toFixed(2)}</span>
                    </p>
                `;
            });
            
            html += `
                <p class="total">
                    <span><strong>Total Paid:</strong></span>
                    <span><strong>RM${currentOrder.totals.grandTotal.toFixed(2)}</strong></span>
                </p>
            `;
            
            successOrderDetails.innerHTML = html;
            
            localStorage.removeItem('currentOrder');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadOrder();
        });
    </script>
</body>
</html>
