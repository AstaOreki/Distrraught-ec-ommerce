<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Distraught</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #fff;
        }

        header {
            background: #fff;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e0e0e0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 40px;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: #222;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #666;
        }

        .cart-link {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #222;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #userGreeting {
            font-weight: 500;
            font-size: 0.9rem;
        }

        #logoutBtn {
            padding: 6px 12px;
            background: none;
            border: 1px solid #222;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        #logoutBtn:hover {
            background: #222;
            color: white;
        }

        main {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
            min-height: 60vh;
        }

        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }

        .cart-container {
            background: #fff;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
            transition: box-shadow 0.3s;
        }

        .cart-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart-item-info {
            flex: 2;
        }

        .cart-item-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .cart-item-price {
            font-size: 14px;
            color: #666;
        }

        .cart-item-controls {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background: none;
            border: 1px solid #ccc;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: #222;
            color: white;
            border-color: #222;
        }

        .quantity-input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .cart-item-subtotal {
            flex: 1;
            text-align: right;
            font-weight: 600;
            font-size: 16px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            margin-left: 20px;
        }

        .remove-btn:hover {
            color: #ff3860;
        }

        .cart-summary {
            background: #f9f9f9;
            padding: 30px;
            margin-top: 30px;
            border: 1px solid #e0e0e0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .summary-row.total {
            border-bottom: none;
            font-size: 20px;
            font-weight: 700;
            margin-top: 10px;
            padding-top: 20px;
            border-top: 2px solid #222;
        }

        .cart-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #222;
            color: white;
            border: 1px solid #222;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #fff;
            color: #222;
        }

        .btn-secondary {
            background: #fff;
            color: #222;
            border: 1px solid #ccc;
        }

        .btn-secondary:hover {
            border-color: #222;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
        }

        .empty-cart p {
            margin-bottom: 20px;
            color: #666;
            font-size: 16px;
        }

        .cart-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        footer {
            background: #f5f5f5;
            text-align: center;
            padding: 30px 20px;
            margin-top: 60px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .cart-item-controls {
                width: 100%;
                flex-wrap: wrap;
            }
            
            .cart-item-subtotal {
                text-align: left;
                width: 100%;
            }
            
            .cart-actions {
                flex-direction: column;
            }
            
            .cart-actions .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo.jpg" alt="Distraught Logo">
                Distraught
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="product.html">Shop</a>
                <a href="aftersignup.html">My Account</a>
                <a href="shoppingcart.html" class="cart-link">
                    Cart <span class="cart-count" id="cartCount">0</span>
                </a>
                <div class="user-section">
                    <span id="userGreeting"></span>
                    <button id="logoutBtn" style="display:none; padding:6px 12px; background:none; border:1px solid #222; cursor:pointer;">Logout</button>
                    <a href="signup.html" id="loginLink" class="btn" style="padding:6px 12px; font-size:0.8rem;">Sign In</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <h1>Shopping Cart</h1>
        <div id="cart-container" class="cart-container">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Distraught. All rights reserved.</p>
        <p>Free shipping on orders over RM50</p>
    </footer>

    <script>
        function getUsers() {
            return JSON.parse(localStorage.getItem('users')) || [];
        }

        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getCurrentUser() {
            const email = localStorage.getItem('currentUserEmail');
            if (!email) return null;
            const users = getUsers();
            return users.find(u => u.email === email);
        }

        function updateCurrentUser(updatedUser) {
            const users = getUsers();
            const index = users.findIndex(u => u.email === updatedUser.email);
            if (index !== -1) {
                users[index] = updatedUser;
                saveUsers(users);
            }
        }
        const CartManager = {
            cart: [],

            init() {
                this.cart = this.loadCart();
                this.updateCartCount();
                console.log('Cart initialized:', this.cart);
            },

            loadCart() {
                const user = getCurrentUser();
                if (user) {
                    return user.cart || [];
                } else {
                    const cartData = localStorage.getItem('guestCart');
                    return cartData ? JSON.parse(cartData) : [];
                }
            },

            saveCart() {
                const user = getCurrentUser();
                if (user) {
                    user.cart = this.cart;
                    updateCurrentUser(user);
                } else {
                    localStorage.setItem('guestCart', JSON.stringify(this.cart));
                }
                this.updateCartCount();
                console.log('Cart saved:', this.cart);
            },

            addItem(productId, productName, productPrice) {
                const existingItem = this.cart.find(item => item.id == productId);
                
                if (existingItem) {
                    existingItem.quantity += 1;
                } else {
                    this.cart.push({
                        id: productId,
                        name: productName,
                        price: parseFloat(productPrice),
                        quantity: 1
                    });
                }
                
                this.saveCart();
                this.showNotification(`${productName} added to cart!`);
            },

            removeItem(productId) {
                this.cart = this.cart.filter(item => item.id != productId);
                this.saveCart();
                this.displayCart();
                this.showNotification('Item removed from cart');
            },

            clearCart() {
                if (confirm('Are you sure you want to clear your cart?')) {
                    this.cart = [];
                    this.saveCart();
                    this.displayCart();
                    this.showNotification('Cart cleared');
                }
            },

            updateQuantity(productId, newQuantity) {
                newQuantity = parseInt(newQuantity);
                if (newQuantity < 1) {
                    this.removeItem(productId);
                    return;
                }

                const item = this.cart.find(item => item.id == productId);
                if (item) {
                    item.quantity = newQuantity;
                    this.saveCart();
                    this.displayCart();
                }
            },

            getCartTotals() {
                const totalItems = this.cart.reduce((sum, item) => sum + item.quantity, 0);
                const totalPrice = this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                return { totalItems, totalPrice: totalPrice.toFixed(2) };
            },

            displayCart() {
                const cartContainer = document.getElementById('cart-container');
                if (!cartContainer) return;
                
                if (this.cart.length === 0) {
                    cartContainer.innerHTML = `
                        <div class="empty-cart">
                            <p>Your cart is empty</p>
                            <a href="product.html" class="btn">Continue Shopping</a>
                        </div>
                    `;
                    return;
                }

                let cartHTML = '';
                let subtotal = 0;
                
                this.cart.forEach(item => {
                    const itemTotal = item.price * item.quantity;
                    subtotal += itemTotal;
                    
                    cartHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-title">${item.name}</div>
                                <div class="cart-item-price">RM${item.price.toFixed(2)} each</div>
                            </div>
                            <div class="cart-item-controls">
                                <button class="quantity-btn" onclick="CartManager.updateQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" onchange="CartManager.updateQuantity(${item.id}, this.value)">
                                <button class="quantity-btn" onclick="CartManager.updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
                                <button class="remove-btn" onclick="CartManager.removeItem(${item.id})">Remove</button>
                            </div>
                            <div class="cart-item-subtotal">
                                RM${itemTotal.toFixed(2)}
                            </div>
                        </div>
                    `;
                });

                const shipping = subtotal >= 50 ? 0 : 10;
                const total = subtotal + shipping;

                cartHTML += `
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>RM${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="summary-row">
                            <span>Shipping</span>
                            <span>${shipping === 0 ? 'Free' : 'RM' + shipping.toFixed(2)}</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>RM${total.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="cart-actions">
                        <a href="product.html" class="btn btn-secondary">Continue Shopping</a>
                        <div>
                            <button onclick="CartManager.clearCart()" class="btn btn-secondary" style="margin-right: 10px;">Clear Cart</button>
                            <a href="checkout.html" class="btn">Checkout</a>
                        </div>
                    </div>
                `;
                
                cartContainer.innerHTML = cartHTML;
            },

            updateCartCount() {
                const { totalItems } = this.getCartTotals();
                
                document.querySelectorAll('.cart-count').forEach(element => {
                    element.textContent = totalItems;
                });
            },

            showNotification(message) {
                const existingNotification = document.querySelector('.cart-notification');
                if (existingNotification) {
                    existingNotification.remove();
                }
                
                const notification = document.createElement('div');
                notification.className = 'cart-notification';
                notification.textContent = message;
                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOut 0.3s ease';
                    setTimeout(() => notification.remove(), 300);
                }, 3000);
            }
        };

        window.addToCart = function(productId, productName, productPrice) {
            CartManager.addItem(productId, productName, productPrice);
        };

        window.removeFromCart = function(productId) {
            CartManager.removeItem(productId);
        };

        window.updateQuantity = function(productId, quantity) {
            CartManager.updateQuantity(productId, quantity);
        };

        window.clearCart = function() {
            CartManager.clearCart();
        };

        function updateUIForUser() {
            const user = getCurrentUser();
            const greeting = document.getElementById('userGreeting');
            const logoutBtn = document.getElementById('logoutBtn');
            const loginLink = document.getElementById('loginLink');
            
            if (user) {
                greeting.textContent = `Welcome, ${user.name.split(' ')[0]}`;
                logoutBtn.style.display = 'block';
                loginLink.style.display = 'none';
            } else {
                greeting.textContent = '';
                logoutBtn.style.display = 'none';
                loginLink.style.display = 'inline-block';
            }
            
            CartManager.updateCartCount();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('currentUserEmail');
                localStorage.removeItem('userName');
                localStorage.removeItem('authToken');
                window.location.href = 'index.html';
            }
        }

        function syncGuestCartWithUser() {
            const user = getCurrentUser();
            if (user) {
                const guestCart = JSON.parse(localStorage.getItem('guestCart')) || [];
                if (guestCart.length > 0) {
                    user.cart = user.cart || [];
                    guestCart.forEach(guestItem => {
                        const existing = user.cart.find(item => item.id == guestItem.id);
                        if (existing) {
                            existing.quantity += guestItem.quantity;
                        } else {
                            user.cart.push(guestItem);
                        }
                    });
                    updateCurrentUser(user);
                    localStorage.removeItem('guestCart');
                    CartManager.cart = user.cart;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateUIForUser();
            syncGuestCartWithUser();
            CartManager.init();
            CartManager.displayCart();
            
            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', logout);
            }
        });
    </script>
</body>
</html>
