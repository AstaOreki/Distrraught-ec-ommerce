<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Distraught</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #fff;
            color: #000;
        }

        header {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 40px;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo img {
            height: 40px;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #000;
            font-size: 14px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: 20px;
        }

        #userGreeting {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .checkout-container {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .checkout-title {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-align: center;
        }

        .checkout-section {
            border: 1px solid #e0e0e0;
            padding: 30px;
            margin-bottom: 30px;
            background: #fff;
        }

        .checkout-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-summary {
            background: #f9f9f9;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-name {
            flex: 2;
        }

        .item-price, .item-quantity, .item-total {
            flex: 1;
            text-align: right;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #000;
        }

        .checkout-summary {
            border-top: 2px solid #000;
            padding-top: 20px;
            text-align: right;
            font-size: 18px;
            font-weight: 600;
        }

        .checkout-actions {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .btn-primary {
            padding: 14px 30px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #fff;
            color: #000;
        }

        .btn-secondary {
            padding: 14px 30px;
            background: #fff;
            color: #000;
            border: 1px solid #d9d9d9;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            border-color: #000;
        }

        .error-message {
            color: #ff3860;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #f8f8f8;
            margin-top: 60px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-price, .item-quantity, .item-total {
                text-align: left;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="logo.jpg" alt="Distraught Logo">
                Distraught
            </div>
            <nav>
                <a href="index.html">Home</a>
                <a href="product.html">Shop</a>
                <a href="shoppingcart.html">Cart</a>
                <div class="user-section">
                    <span id="userGreeting"></span>
                </div>
            </nav>
        </div>
    </header>

    <main class="checkout-container">
        <h1 class="checkout-title">Checkout</h1>

        <div id="checkoutContent">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Distraught. All rights reserved.</p>
        <p>Free shipping on orders over RM50</p>
    </footer>

    <script>
        function getUsers() {
            return JSON.parse(localStorage.getItem('users')) || [];
        }

        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getCurrentUser() {
            const email = localStorage.getItem('currentUserEmail');
            if (!email) return null;
            const users = getUsers();
            return users.find(u => u.email === email);
        }

        function updateCurrentUser(updatedUser) {
            const users = getUsers();
            const index = users.findIndex(u => u.email === updatedUser.email);
            if (index !== -1) {
                users[index] = updatedUser;
                saveUsers(users);
            }
        }

        function loadCart() {
            const user = getCurrentUser();
            if (user) {
                return user.cart || [];
            } else {
                return JSON.parse(localStorage.getItem('guestCart')) || [];
            }
        }

        function displayCheckout() {
            const cart = loadCart();
            const checkoutContent = document.getElementById('checkoutContent');
            
            if (cart.length === 0) {
                checkoutContent.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: #f9f9f9;">
                        <p>Your cart is empty. Please add items to your cart before checkout.</p>
                        <a href="product.html" class="btn-secondary" style="margin-top: 20px;">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let cartItemsHtml = '';

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                cartItemsHtml += `
                    <div class="cart-item">
                        <div class="item-name">${item.name} (x${item.quantity})</div>
                        <div class="item-price">RM${item.price.toFixed(2)} each</div>
                        <div class="item-total">RM${itemTotal.toFixed(2)}</div>
                    </div>
                `;
            });

            const shipping = subtotal >= 50 ? 0 : 10;
            const total = subtotal + shipping;

            const user = getCurrentUser();

            checkoutContent.innerHTML = `
                <div class="checkout-section cart-summary">
                    <h3>Order Items</h3>
                    ${cartItemsHtml}
                </div>

                <div class="checkout-section">
                    <h3>Customer Information</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="firstName" placeholder="First name" required>
                            <div class="error-message" id="firstNameError"></div>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="lastName" placeholder="Last name" required>
                            <div class="error-message" id="lastNameError"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Email address" value="${user?.email || ''}" required>
                        <div class="error-message" id="emailError"></div>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" placeholder="Phone number" required>
                        <div class="error-message" id="phoneError"></div>
                    </div>
                </div>

                <div class="checkout-section">
                    <h3>Shipping Address</h3>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea id="address" rows="3" placeholder="Street address" required></textarea>
                        <div class="error-message" id="addressError"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="city" placeholder="City" required>
                            <div class="error-message" id="cityError"></div>
                        </div>
                        <div class="form-group">
                            <label>Postcode</label>
                            <input type="text" id="postcode" placeholder="Postcode" required>
                            <div class="error-message" id="postcodeError"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>State</label>
                        <input type="text" id="state" placeholder="State" required>
                        <div class="error-message" id="stateError"></div>
                    </div>
                </div>

                <div class="checkout-section">
                    <h3>Order Summary</h3>
                    <p style="margin-bottom: 10px;">Items Total: RM ${subtotal.toFixed(2)}</p>
                    <p style="margin-bottom: 10px;">Shipping: RM ${shipping.toFixed(2)}</p>
                    <div class="checkout-summary">
                        Total: RM ${total.toFixed(2)}
                    </div>
                </div>

                <div class="checkout-actions">
                    <a href="shoppingcart.html" class="btn-secondary">Back to Cart</a>
                    <button class="btn-primary" onclick="processCheckout()">Proceed to Payment</button>
                </div>
            `;

            if (user) {
                const nameParts = user.name.split(' ');
                document.getElementById('firstName').value = nameParts[0] || '';
                document.getElementById('lastName').value = nameParts.slice(1).join(' ') || '';
            }
        }

        function validateForm() {
            let isValid = true;

            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const postcode = document.getElementById('postcode').value.trim();
            const state = document.getElementById('state').value.trim();

            if (!firstName) {
                document.getElementById('firstNameError').textContent = 'First name is required';
                document.getElementById('firstNameError').style.display = 'block';
                isValid = false;
            }

            if (!lastName) {
                document.getElementById('lastNameError').textContent = 'Last name is required';
                document.getElementById('lastNameError').style.display = 'block';
                isValid = false;
            }

            if (!email) {
                document.getElementById('emailError').textContent = 'Email is required';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email';
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            if (!phone) {
                document.getElementById('phoneError').textContent = 'Phone number is required';
                document.getElementById('phoneError').style.display = 'block';
                isValid = false;
            }

            if (!address) {
                document.getElementById('addressError').textContent = 'Address is required';
                document.getElementById('addressError').style.display = 'block';
                isValid = false;
            }

            if (!city) {
                document.getElementById('cityError').textContent = 'City is required';
                document.getElementById('cityError').style.display = 'block';
                isValid = false;
            }

            if (!postcode) {
                document.getElementById('postcodeError').textContent = 'Postcode is required';
                document.getElementById('postcodeError').style.display = 'block';
                isValid = false;
            }

            if (!state) {
                document.getElementById('stateError').textContent = 'State is required';
                document.getElementById('stateError').style.display = 'block';
                isValid = false;
            }

            return isValid;
        }

        window.processCheckout = function() {
            if (!validateForm()) {
                return;
            }

            const cart = loadCart();
            if (cart.length === 0) {
                alert('Your cart is empty');
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal >= 50 ? 0 : 10;
            const total = subtotal + shipping;

            const order = {
                orderId: 'ORD' + Date.now(),
                customer: {
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim()
                },
                shipping: {
                    address: document.getElementById('address').value.trim(),
                    city: document.getElementById('city').value.trim(),
                    postcode: document.getElementById('postcode').value.trim(),
                    state: document.getElementById('state').value.trim()
                },
                items: cart.map(item => ({...item})),
                totals: {
                    subtotal: subtotal,
                    shipping: shipping,
                    grandTotal: total
                },
                date: new Date().toISOString(),
                status: 'pending'
            };

            localStorage.setItem('currentOrder', JSON.stringify(order));
            
            const user = getCurrentUser();
            if (user) {
                if (!user.orders) user.orders = [];
                user.orders.push(order);
                updateCurrentUser(user);
            }

            window.location.href = 'payment.html';
        };

        function updateUIForUser() {
            const user = getCurrentUser();
            const greeting = document.getElementById('userGreeting');
            
            if (user) {
                greeting.textContent = `Welcome, ${user.name.split(' ')[0]}`;
            } else {
                greeting.textContent = 'Guest';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateUIForUser();
            displayCheckout();

            if (!getCurrentUser()) {
                console.log('Guest checkout');
            }
        });
    </script>
</body>
</html>
